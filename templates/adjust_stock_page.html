<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales and Inventory Management System</title>
    <link rel="stylesheet" href="{{url_for('static',filename='styles/style.css')}}">
</head>

<body>
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    <div class="flash-container">
        {% for category, message in messages %}
        <div class="flash {{category}}">
            {{message}}
        </div>
        {% endfor %}
    </div>
    {% endif %}
    {% endwith %}
    <a href="/stock_page" class="back-link">← Stock</a>
    <h1 class="page-title">Adjust stock — {{product.name}}</h1>
    <div class="section-card">
        <form method="post" action="/adjust_stock/{{product.product_id}}">
            <label>Current Stock</label>
            <input type="number" value="{{product.stock}}" readonly>
            <br>
            <label>Action</label>
            <span class="radio-group">
                <label>
                    <input type="radio" name="action" value="add" checked>Add stock
                </label>
                <label>
                    <input type="radio" name="action" value="remove"> Remove stock
                </label>
            </span>
            <br>
            <label>Quantity</label>
            <input type="number" name="quantity" min="1" required>
            <button type="submit" class="primary-button">Confirm adjustment</button>
        </form>
    </div>

</body>

</html>
